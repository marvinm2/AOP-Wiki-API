name: Live checks

# Runs the API against the public AOP-Wiki SPARQL endpoint after the weekly data reload
# (Sunday 06:00 UTC), so schema changes in AOPWikiRDF surface here rather than in production.
on:
  schedule:
    - cron: "0 9 * * 0"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Live tests
        run: pytest -m live tests/live
